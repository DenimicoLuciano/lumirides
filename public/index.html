<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LumiRides 🚗 — Personal rides in Markham & the GTA</title>
<meta name="description" content="LumiRides — a personal ride service run by one driver, Denim, in Markham & the GTA. Book a trip, pay by Interac e-transfer or cash on arrival.">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="logo">🚗 LumiRides</div>
  <div class="row"><span id="authArea"></span></div>
</header>

<main class="wrap" id="app"></main>

<nav class="bottomnav" id="bottomNav"></nav>

<div id="toasts"></div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => { /* offline shell is a bonus, not a requirement */ });
    });
  }
</script>
</body>
</html>
